<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pyrinth Stove & Smithy - Features</title>
    <style>
        :root {
            --rimworld-bg-dark: #282828;
            --rimworld-bg-darker: #181818;
            --rimworld-bg-panel: #343434;
            --rimworld-bg-panel-light: #2a3e50;
            --rimworld-text: #d4d4d4;
            --rimworld-text-muted: #9a9a9a;
            --rimworld-text-bright: #ffffff;
            --rimworld-accent-gold: #6a0000;
            --rimworld-accent-blue: #4a90d9;
            --spacing-xs: 4px;
            --spacing-sm: 8px;
            --spacing-md: 16px;
            --spacing-lg: 24px;
            --radius-sm: 4px;
            --radius-md: 8px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--rimworld-bg-darker);
            color: var(--rimworld-text);
            line-height: 1.6;
            font-size: 1.3em;
            padding: var(--spacing-lg);
        }

        .feature-table {
            width: 950px;
            border-collapse: separate;
            border-spacing: 0;
            background: var(--rimworld-bg-panel);
            border-radius: var(--radius-md);
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.1);
            margin-bottom: 1em;
            margin-top: 1em;
        }

        .feature-table tr { border-bottom: 1px solid rgba(255,255,255,0.05); }
        .feature-table tr:last-child { border-bottom: none; }
        .feature-table tr:nth-child(even) { background: rgba(255,255,255,0.02); }

        .feature-table th {
            padding: var(--spacing-md) var(--spacing-lg);
            text-align: left;
            font-size: 0.9em;
            color: var(--rimworld-accent-gold);
            font-weight: 600;
            background: rgba(0,0,0,0.2);
            border-bottom: 2px solid rgba(255,255,255,0.1);
        }

        .cell-graphic {
            width: 140px;
            padding: var(--spacing-md);
            text-align: center;
            vertical-align: middle;
            background: rgba(0,0,0,0.1);
        }

        .cell-graphic img {
            max-width: 120px;
            max-height: 120px;
            object-fit: contain;
            filter: drop-shadow(0 0 8px rgba(0,0,0,0.5));
        }

        .cell-description {
            padding: var(--spacing-md) var(--spacing-lg);
            vertical-align: middle;
            width: 40%;
        }

        .cell-description h3 {
            font-size: 1.1em;
            color: var(--rimworld-text-bright);
            margin-bottom: var(--spacing-xs);
            font-weight: 600;
        }

        .cell-description p {
            font-size: 0.9em;
            color: var(--rimworld-text-muted);
            line-height: 1.5;
        }

        .cell-cost {
            width: 25%;
            padding: var(--spacing-md) var(--spacing-lg);
            vertical-align: middle;
        }

        .cost-table {
            width: 100%;
            border-collapse: collapse;
        }

        .cost-table td {
            padding: 2px 4px;
            text-align: center;
            font-size: 0.85em;
        }

        .cost-table .amount {
            color: var(--rimworld-text-bright);
            font-weight: 600;
            width: 25%;
        }

        .cost-table .material {
            color: var(--rimworld-text);
            text-align: left;
            width: 50%;
        }

        .cost-table .icon {
            width: 25%;
        }

        .icon-steel { display: inline-block; }
        .icon-hemogen { display: inline-block; }

        .cost-skill {
            margin-top: var(--spacing-xs);
            font-size: 0.85em;
            color: var(--rimworld-text-muted);
            font-style: italic;
        }

        .cell-stats {
            width: 25%;
            padding: var(--spacing-md) var(--spacing-lg);
            vertical-align: middle;
        }

        .stats-list {
            list-style: none;
            font-size: 0.85em;
        }

        .stats-list li {
            padding: var(--spacing-xs) 0;
            position: relative;
            padding-left: var(--spacing-md);
            color: var(--rimworld-text-muted);
        }

        .stats-list li::before {
            content: '\2022';
            position: absolute;
            left: 0;
            font-size: 0.8em;
        }

        .tag {
            display: inline-block;
            padding: 2px 8px;
            margin: 2px 0;
            border-radius: var(--radius-sm);
            font-size: 0.75em;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .tag-research {
            background: var(--rimworld-bg-darker);
            border: 1px solid var(--rimworld-accent-gold);
            color: var(--rimworld-text);
        }

    </style>
</head>
<body>
<table class="feature-table">
    <thead>
    <tr>
        <th></th>
        <th>Description</th>
        <th>Cost</th>
        <th>Features & Stats</th>
    </tr>
    </thead>
    <tbody>
    <!-- PYRINTH FLOOR -->
    <tr>
        <td class="cell-graphic">
            <img src="textures/floor.png" alt="Hemogen floor">
        </td>
        <td class="cell-description">
            <h3>Hemogen Floor</h3>
            <p>Floor made out of <strong>collected hemogen</strong> It has a fascinating structure that catches the eye.</p>
            <div><span class="tag tag-research">Requires research: Deathrest</span></div>
        </td>
        <td class="cell-cost">
            <table class="cost-table">
                <tr><td class="amount">1</td><td class="material">Steel</td><td class="icon"><span class="icon-steel"><img src="textures/Steel_c.png" alt="Steel"></span></td></tr>
                <tr><td class="amount">5</td><td class="material">Hemogen Pack</td><td class="icon"><span class="icon-hemogen"><img src="textures/HemogenPack_c.png" alt="Hemogen Pack"></span></td></tr>
            </table>
            <span class="cost-skill">requires 3 Construction</span>
        </td>
        <td class="cell-stats">
            <ul class="stats-list">
                <li>Glow radius: 3 cells</li>
                <li>Pretty <strong>+6 beauty</strong></li>
            </ul>
        </td>
    </tr>

    </tbody>
</table>
</body>
</html>
